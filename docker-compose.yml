version: "3.8"

services:
  eve:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eve
    ports:
      - "${EVE_PORT:-8100}:${EVE_PORT:-8100}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - eve_data:/app/data
    env_file:
      - .env
    restart: unless-stopped

volumes:
  eve_data:
